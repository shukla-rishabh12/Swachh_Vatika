services:
  - type: web
    name: swachh-seva
    env: python
    region: singapore
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:create_app() --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_PATH
        value: /var/data/swachh_seva.db
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: UPLOAD_FOLDER
        value: /var/data/uploads
      - key: MAX_UPLOAD_SIZE_MB
        value: "5"
      - key: CORS_ORIGINS
        value: "*"
    disk:
      name: swachh-data
      mountPath: /var/data
      sizeGB: 1