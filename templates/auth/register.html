<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register — Swachh-Vatika</title>
  <link rel="stylesheet" href="/static/css/app.css" />
</head>
<body class="auth-page">

  <div class="auth-card">
    <div class="auth-brand">Swachh-Vatika</div>
    <h1>Create your account</h1>

    <form id="register-form" novalidate>
      <div class="form-group">
        <label for="full_name">Full Name</label>
        <input id="full_name" name="full_name" type="text" required autocomplete="name" placeholder="Your full name" />
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" required autocomplete="email" placeholder="you@example.com" />
      </div>
      <div class="form-group">
        <label for="phone">Phone (optional)</label>
        <input id="phone" name="phone" type="tel" autocomplete="tel" placeholder="10-digit number" />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" required autocomplete="new-password" placeholder="Minimum 6 characters" />
        <small class="help-text">At least 6 characters.</small>
      </div>

      <div id="register-error" class="form-error" style="display:none;"></div>

      <button type="submit" id="register-btn" class="btn-primary btn-block">Create Account</button>
    </form>

    <p class="auth-footer">
      Already have an account? <a href="/auth/login.html">Login</a>
    </p>
  </div>

  <script src="/static/js/core/api.js"></script>
  <script src="/static/js/core/utils.js"></script>
  <script src="/static/js/core/auth.js"></script>

  <script>
    (function () {
      const form  = document.getElementById('register-form');
      const btn   = document.getElementById('register-btn');
      const errEl = document.getElementById('register-error');

      (async () => {
        const u = await window.auth.load();
        if (u) window.auth.redirectAfterLogin(u.role);
      })();

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errEl.style.display = 'none';
        btn.disabled = true;
        btn.textContent = 'Creating account...';

        const payload = {
          full_name: document.getElementById('full_name').value.trim(),
          email:     document.getElementById('email').value.trim(),
          phone:     document.getElementById('phone').value.trim(),
          password:  document.getElementById('password').value,
        };

        if (!payload.full_name || !payload.email || !payload.password) {
          errEl.textContent = 'Name, email and password are required.';
          errEl.style.display = 'block';
          btn.disabled = false;
          btn.textContent = 'Create Account';
          return;
        }
        if (payload.password.length < 6) {
          errEl.textContent = 'Password must be at least 6 characters.';
          errEl.style.display = 'block';
          btn.disabled = false;
          btn.textContent = 'Create Account';
          return;
        }

        try {
          const user = await window.auth.register(payload);
          window.utils.toast('Registration successful!', 'success', 1500);
          setTimeout(() => window.auth.redirectAfterLogin(user.role), 400);
        } catch (err) {
          errEl.textContent = (err && err.message) || 'Registration failed.';
          errEl.style.display = 'block';
          btn.disabled = false;
          btn.textContent = 'Create Account';
        }
      });
    })();
  </script>

</body>
</html>
